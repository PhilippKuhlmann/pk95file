name: ODJ spike

# Offline domain join between PK95 AD (ghcr.io/philippkuhlmann/pk95-ad:1.5.0) and a Samba member – decides the
# PK95 AD endpoint POST /api/computers/odj (docs/design.md §4). Not part of the image build.
on:
  workflow_dispatch:
  push:
    branches: ['spike/**']
    paths: ['spike/odj/**', '.github/workflows/odj-spike.yml']

permissions:
  contents: read

jobs:
  odj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline join spike
        run: bash spike/odj/run.sh
