# ODJ spike: member smb.conf as planned for PK95 File (docs/design.md §5, §9), reduced to one share.
[global]
    workgroup = CIEXAMPLE
    realm = CI.EXAMPLE.TEST
    netbios name = FILES
    security = ads
    server role = member server
    password server = dc1.ci.example.test
    interfaces = 172.30.0.53/24
    bind interfaces only = yes
    smb ports = 445
    disable netbios = yes
    server min protocol = SMB2_10
    kerberos method = secrets only
    winbind refresh tickets = yes
    winbind enum users = no
    winbind enum groups = no
    idmap config * : backend = tdb
    idmap config * : range = 3000-7999
    idmap config CIEXAMPLE : backend = rid
    idmap config CIEXAMPLE : range = 10000-64999
    template shell = /bin/false
    template homedir = /nonexistent
    vfs objects = acl_xattr
    acl_xattr:security_acl_name = user.NTACL
    acl_xattr:ignore system acls = yes
    map acl inherit = yes
    store dos attributes = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    log file = /var/log/samba/log.%m
    log level = 1

[spike]
    path = /srv/files/shares/spike
    read only = no
